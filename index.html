<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#213149;background:#f6f8fc}button,a,input{font:inherit}main{max-width:760px;margin:12vh auto;padding:28px;background:white;border:1px solid #dde4ed;border-radius:16px}h1{font-size:27px;margin:0 0 12px}p{line-height:1.7;color:#627188}label{display:block;margin:24px 0 8px}input{padding:12px;border:1px solid #bdcadd;border-radius:8px;width:100%}button{padding:11px 17px;border:1px solid #cbd6e5;border-radius:8px;background:white;color:#244b7b;cursor:pointer}button:disabled{opacity:.5}#unlock{margin-top:14px;background:#244b7b;color:white}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices a{display:block;padding:20px;border:1px solid #dbe3ed;border-radius:10px;text-decoration:none;color:#244b7b}.choices a:hover{background:#eef4fd}#message{min-height:24px;color:#9d3441}#loading{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;background:white;border:1px solid #dbe3ed;padding:12px 18px;border-radius:10px;box-shadow:0 3px 15px #1232}#board{display:none;width:100%;height:100dvh;border:0;background:white}#bpb-lock{display:none;position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:0 3px 16px #14263b18}.error-actions{display:none}#update{display:none;position:fixed;right:18px;top:10px;z-index:30}@media(max-width:600px){main{margin:5vh 14px;padding:20px}.choices{grid-template-columns:1fr}#loading{width:80%;font-size:13px}}</style></head><body>
<main id="landing"><h1>下游看板</h1><p id="intro">BPB、正式下游与数据分析。解锁后选择板块，按需加载。</p>
<form id="unlock-form"><label for="password">访问密码</label><input id="password" type="password" autocomplete="off" required><button id="unlock" type="submit">解锁看板</button></form>
<p id="message" role="alert" aria-live="polite"></p>
<div id="choices" class="choices" hidden><a href="#formal">正式下游评测 →</a><a href="#overview">BPB 训练曲线 →</a><a href="#contamination">评测集污染分析 →</a><a href="#pretraining">预训练数据分类 →</a></div>
<div id="retry-actions" class="error-actions"><button id="retry">重新加载</button> <button id="home">选择其它板块</button></div>
</main><div id="loading" role="status"></div><iframe id="board" title="评测看板" referrerpolicy="no-referrer"></iframe><button id="bpb-lock">锁定报告</button><button id="update">有新结果 · 刷新 ↻</button>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder(),frame=$('board');
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const envelope=JSON.parse($('lazy-envelope').textContent),VERSION='ncp-lazy-v1';
let key=null,manifest=null,runtime=null,active=null,generation=0,baseVersion=null,pendingSnapshot=null;
// Transfer the already-parsed object to the same-origin frame without another
// 80MB JSON copy in srcdoc, DOM text and the child parser.
window.__ncpTakeSnapshot=()=>{const snapshot=pendingSnapshot;pendingSnapshot=null;return snapshot;};
const boardOf=hash=>hash.startsWith('#formal')?'formal':hash.startsWith('#contamination')?'contamination':hash.startsWith('#pretraining')?'pretraining':'bpb';
async function sha(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');}
async function unpack(bytes,iv,id){const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(iv),additionalData:enc.encode(VERSION+':'+id)},key,bytes);return new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
async function asset(info){const url=new URL(info.path,location.href.split('#')[0]);if(url.origin!==location.origin||!/^assets\/[a-f0-9]{64}\.bin$/.test(info.path))throw new Error('invalid asset');const r=await fetch(url,{credentials:'omit'});if(!r.ok)throw new Error('download');const bytes=await r.arrayBuffer();if(bytes.byteLength!==info.bytes||await sha(bytes)!==info.sha256)throw new Error('checksum');const plain=await unpack(bytes,info.iv,info.id);if(await sha(plain)!==info.plain_sha256)throw new Error('decoded checksum');return dec.decode(plain);}
const safeJson=x=>JSON.stringify(x).replaceAll('<','\\u003c');
function bridge(hash){return '<script>(()=>{const hash='+safeJson(hash)+';location.hash=hash;const group=h=>h.startsWith("#formal")?"formal":h.startsWith("#contamination")?"contamination":h.startsWith("#pretraining")?"pretraining":"bpb";document.addEventListener("click",e=>{const a=e.target.closest?.("a[href]");if(!a)return;const h=a.getAttribute("href");if(h?.startsWith("#")&&group(h)!==group(location.hash)){e.preventDefault();e.stopImmediatePropagation();parent.postMessage({type:"ncp-board-route",hash:h},parent.location.origin);}},true);addEventListener("hashchange",()=>parent.postMessage({type:"ncp-board-route",hash:location.hash},parent.location.origin));addEventListener("message",e=>{if(e.source===parent&&e.data?.type==="ncp-set-route")location.hash=e.data.hash;});})();<\/script>';}
async function show(){
 if(!key||!manifest)return;
 if(!location.hash){generation++;active=null;frame.srcdoc='';frame.style.display='none';$('landing').style.display='block';$('choices').hidden=false;return;}
 const board=boardOf(location.hash);
 if(board===active){if(frame.contentWindow.location.hash!==location.hash)frame.contentWindow.postMessage({type:'ncp-set-route',hash:location.hash},location.origin);return;}
 const ticket=++generation;active=null;$('loading').style.display='block';$('loading').textContent='正在加载'+({formal:'正式下游',bpb:'BPB',contamination:'污染分析',pretraining:'预训练数据分类'}[board])+'…';$('message').textContent='';$('retry-actions').style.display='none';
 try{
  // Only the requested board is downloaded. Previous iframe data is released on switch.
  frame.srcdoc='';frame.style.display='none';$('landing').style.display='block';
  const values=await Promise.all([runtime?Promise.resolve(runtime):asset(manifest.runtime),asset(manifest.boards[board])]);
  if(ticket!==generation)return;runtime=values[0];
  const snapshot=JSON.parse(values[1]);if(!snapshot.queries)throw new Error('snapshot');
  pendingSnapshot=snapshot;
  const element='<script type="application/json" id="data-app-reviewed-snapshot">{}<\/script>';
  let html=runtime.replace('__LAZY_SNAPSHOT_SLOT__',element);if(html===runtime)throw new Error('runtime');
  html=html.replace('<head>','<head>'+bridge(location.hash));
  frame.onload=()=>{if(ticket!==generation)return;active=board;$('loading').style.display='none';$('landing').style.display='none';frame.style.display='block';};
  frame.srcdoc=html;
 }catch(e){if(ticket!==generation)return;$('loading').style.display='none';$('message').textContent='该板块未能完整加载，请重试。已有评测结果不受影响。';$('retry-actions').style.display='block';}
}
$('unlock-form').addEventListener('submit',async e=>{e.preventDefault();$('unlock').disabled=true;$('unlock').textContent='正在解锁…';try{
 if(envelope.version!==VERSION||envelope.iterations!==600000||!crypto.subtle||!window.DecompressionStream)throw new Error('unsupported');
 const material=await crypto.subtle.importKey('raw',enc.encode($('password').value),'PBKDF2',false,['deriveKey']);$('password').value='';
 key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 manifest=JSON.parse(dec.decode(await unpack(decode(envelope.ciphertext),envelope.iv,'manifest')));if(manifest.version!==VERSION)throw new Error('format');
 $('unlock-form').hidden=true;$('message').textContent='';$('intro').textContent='选择要查看的板块。';$('choices').hidden=false;$('bpb-lock').style.display='block';await show();
 }catch(e){key=null;manifest=null;$('password').value='';$('message').textContent='密码不正确，或当前浏览器不支持解锁。';}finally{$('unlock').disabled=false;$('unlock').textContent='解锁看板';}});
addEventListener('hashchange',show);
addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data?.type==='ncp-board-route'&&typeof e.data.hash==='string'&&e.data.hash.startsWith('#')){location.hash=e.data.hash;}});
$('retry').onclick=show;$('home').onclick=()=>location.hash='';$('bpb-lock').onclick=()=>{key=null;manifest=null;runtime=null;pendingSnapshot=null;generation++;frame.srcdoc='';location.reload();};$('update').onclick=()=>location.reload();
// Report versions change independently of the currently open board.
async function check(){try{const r=await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store',credentials:'omit'});if(!r.ok)return;const v=r.headers.get('etag')||r.headers.get('last-modified');if(v&&baseVersion&&v!==baseVersion)$('update').style.display='block';if(v)baseVersion=v;}catch{}}
if(location.hostname.endsWith('.github.io')){check();setInterval(check,120000);}
})();
</script></body></html>
